# Champgraph manifest drift guard (SUGGESTIONS 1.5).
# Dependency-free source-parsing check: the manifest must advertise exactly the
# actions ChampGraphService implements (plus the deprecated aliases).
name: Manifest drift guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  drift-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run drift guard (no deps)
        run: python3 champiq-canvas/apps/api/tests/test_champgraph_manifest.py
